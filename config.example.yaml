# Sao chép thành config.yaml rồi chỉnh. Mọi đường dẫn tương đối tính từ thư mục chạy lệnh.

workdir: output            # mỗi video có 1 thư mục con: output/<slug>/

genre: co_trang            # co_trang | hien_dai | tam_su | kinh_di  (tên file trong prompts/genres/)

# ------------------------------------------------------------------ chế độ tự động
# `python -m autovideo auto` duyệt từng chủ đề: tìm truyện mới trên nhiều nguồn, bỏ truyện đã làm,
# chạy trọn pipeline, rồi gom thành phẩm vào ready_dir để bạn chỉ việc đăng.
auto:
  ready_dir: ready                 # ready/<ngày>_<slug>/{video.mp4, thumbnail.jpg, title.txt, description.txt, tags.txt}
  history_file: output/history.json
  max_attempts: 2                  # truyện lỗi quá số lần này sẽ bị bỏ qua vĩnh viễn
  per_topic: 1                     # số video mới mỗi chủ đề mỗi lần chạy

# Mỗi chủ đề ghi đè được bất kỳ khóa nào ở trên (genre, tts, render...) => giọng, nhịp đọc,
# tone footage riêng cho từng chủ đề.
topics:
  - name: co_trang_tu_tien
    keywords: ["古风 有声小说 完结", "仙侠 有声书 一口气听完", "修仙 小说 广播剧"]
    sites: [bilisearch, ytsearch]  # bilisearch = Bilibili, ytsearch = YouTube (nhiều kênh TQ re-up Ximalaya/喜马拉雅)
    min_minutes: 20                # bỏ clip ngắn / trailer
    max_minutes: 150
    genre: co_trang
    tts: {voice: vi-VN-NamMinhNeural, rate: "-6%", pitch: "-6Hz"}
    render: {mode: still}

  - name: tam_su_dem_khuya
    keywords: ["深夜电台 情感故事", "睡前故事 情感 治愈", "深夜情感 真实故事"]
    sites: [bilisearch, ytsearch]
    min_minutes: 15
    max_minutes: 90
    genre: tam_su
    tts: {voice: vi-VN-HoaiMyNeural, rate: "-10%", pitch: "-3Hz"}
    render: {mode: footage, footage: {tone: warm}}

  - name: ngon_tinh_hien_dai
    keywords: ["现代言情 有声小说 完结", "甜宠 有声书 全集"]
    sites: [bilisearch, ytsearch]
    min_minutes: 20
    max_minutes: 150
    genre: hien_dai
    tts: {voice: vi-VN-HoaiMyNeural, rate: "-5%", pitch: "+0Hz"}
    render: {mode: footage, footage: {tone: bright}}

channel:
  name: "Đêm Nghe Truyện"
  # Phong cách hình ảnh cố định của kênh — được nối vào mọi image_prompt
  visual_style: "cinematic chinese ink painting, muted teal and amber palette, soft volumetric light, misty, 16:9"
  intro: true              # LLM viết lời dẫn ~30s mang dấu ấn kênh
  outro: true              # LLM viết lời bình cuối truyện

source:
  # yt-dlp search prefix: bilisearch | ytsearch  (Douyin/Ximalaya/Xiaoyuzhou: truyền URL trực tiếp)
  search_site: bilisearch
  max_per_keyword: 3
  cookies_file: null       # cookies.txt nếu nguồn cần đăng nhập

asr:
  engine: local            # local (máy bạn) | groq (cloud, nhanh, có free) | gemini (cloud)
  chunk_minutes: 10        # cloud: cắt audio thành đoạn ngắn trước khi gửi
  groq_model: whisper-large-v3
  gemini_model: gemini-2.5-flash
  # --- chỉ dùng khi engine: local ---
  model: large-v3          # máy yếu: small / medium
  device: cuda             # cuda | cpu
  compute_type: float16    # float16 (GPU) | int8 (CPU)
  language: zh
  vad_filter: true

llm:
  provider: anthropic      # anthropic | gemini
  model: claude-opus-5-5   # gemini: ví dụ gemini-2.5-pro
  effort: medium           # chỉ dùng cho anthropic: low | medium | high
  source_chunk_chars: 1500 # số ký tự tiếng Trung mỗi lần gửi dịch
  context_chars: 600       # đoạn dịch trước đó gửi kèm để giữ xưng hô nhất quán
  glossary:                # thuật ngữ / tên riêng cố định (Trung: Việt)
    师尊: "sư tôn"
    灵气: "linh khí"

tts:
  engine: edge             # edge | command
  voice: vi-VN-HoaiMyNeural  # hoặc vi-VN-NamMinhNeural
  rate: "-8%"
  pitch: "-4Hz"
  chunk_words: 250         # 200–300 chữ / đoạn đọc
  gap_ms: 450              # khoảng nghỉ giữa các đoạn
  # engine: command — gọi F5-TTS / XTTS-v2 local. Placeholder: {text_file} {text} {out}
  command: >-
    f5-tts_infer-cli --model F5TTS_v1_Base --ref_audio assets/voice_ref.wav
    --ref_text "" --gen_file {text_file} --output_dir {out_dir} --output_file {out_name}

thumbnail:
  image_engine: placeholder   # placeholder | comfyui (GPU máy bạn) | cloud (Google Imagen, không tốn GPU)
  cloud_image_model: imagen-4.0-generate-001   # hoặc gemini-2.5-flash-image
  size: [1280, 720]
  template: assets/templates/frame.png   # PNG trong suốt: khung, logo… (bỏ trống nếu chưa có)
  font: assets/fonts/thumb.ttf           # font hỗ trợ tiếng Việt; tự fallback DejaVu nếu không có
  text_color: "#FFE9A8"
  stroke_color: "#000000"
  text_box: [0.05, 0.50, 0.62, 0.95]     # vùng đặt chữ (tỷ lệ x0,y0,x1,y1)
  badge: "{channel_name}"                # nhãn nhỏ góc trên trái (tên kênh / series); "" để tắt
  badge_color: "#B8322A"
  comfyui:                 # dùng khi image_engine: comfyui
    enabled: false
    url: http://127.0.0.1:8188
    workflow: assets/comfyui_workflow_api.json  # export "API format"; đặt {{PROMPT}} trong node text
    timeout: 600

render:
  mode: still              # footage | still (ảnh minh họa theo cảnh) | thumbnail (chỉ dùng ảnh thumbnail làm nền)
  resolution: [1920, 1080]
  fps: 30
  encoder: auto            # auto | h264_nvenc | libx264
  x264_preset: veryfast    # khi không có GPU NVIDIA: máy yếu dùng superfast / ultrafast
  lead_in: 2.0             # giây nhạc trước khi giọng đọc bắt đầu
  tail: 5.0                # giây nhạc sau khi đọc xong
  footage:
    dir: assets/footage
    tone: warm             # thư mục con: warm | dark | bright
    lut: null              # file .cube áp chung
    brightness: -0.04
    seed: null             # null = ngẫu nhiên mỗi video
  still:
    scenes: 6              # số ảnh minh họa (theo chương) — tránh Reused Content
    zoom: 0.08             # biên độ Ken Burns
    zoom_period: 40        # giây cho 1 chu kỳ zoom in/out
    loop: true             # chỉ render 1–2 chu kỳ mỗi ảnh rồi nối lặp (nhanh gấp hàng chục lần)
    upscale: 2.0           # độ mượt Ken Burns; máy yếu: 1.5
    overlay: null          # assets/overlays/dust.mp4 (bụi, mưa, khói…)
    overlay_opacity: 0.35
  audio:
    music_dir: assets/music
    ducking: sidechain     # sidechain | fixed
    music_db: -23          # fixed: mức nhạc nền cố định suốt video
    music_db_idle: -14     # sidechain: mức nhạc khi không có giọng; tự hạ ~10dB khi có giọng
    fade_in: 3
    fade_out: 6
    loudnorm: true
