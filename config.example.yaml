# Sao chép thành config.yaml rồi chỉnh. Mọi đường dẫn tương đối tính từ thư mục chạy lệnh.

workdir: output            # mỗi video có 1 thư mục con: output/<slug>/

genre: ngon_tinh           # ngon_tinh | co_trang | hien_dai | tam_su | kinh_di | hai_huoc | pha_an  (prompts/genres/)

# ------------------------------------------------------------------ chế độ tự động
# `python -m autovideo auto` duyệt từng chủ đề: tìm truyện mới trên nhiều nguồn, bỏ truyện đã làm,
# chạy trọn pipeline, rồi gom thành phẩm vào ready_dir để bạn chỉ việc đăng.
auto:
  ready_dir: ready                 # ready/<ngày>_<slug>/{video.mp4, thumbnail.jpg, title.txt, description.txt, tags.txt}
  history_file: output/history.json
  max_attempts: 2                  # truyện lỗi quá số lần này sẽ bị bỏ qua vĩnh viễn
  per_topic: 1                     # số video mới mỗi chủ đề mỗi lần chạy (khi adaptive: false)
  max_candidates_per_video: 5      # thử tối đa bấy nhiêu truyện để tìm 1 truyện đạt chuẩn
  inbox_dir: inbox                 # thả truyện tự tuyển (.txt Trung/Việt) vào inbox/<chủ_đề>/ — làm trước
  inbox_topic: null                # chủ đề cho file nằm thẳng trong inbox/ (null = chủ đề bật đầu tiên)
  # Tự dồn sản lượng cho chủ đề ăn khách (cần youtube.enabled để có số liệu view):
  adaptive: false
  daily_total: 3                   # tổng số video mỗi lần chạy khi adaptive: true
  adaptive_power: 1.0              # >1: dồn mạnh hơn cho chủ đề tốt nhất

# ------------------------------------------------------------------ cổng chất lượng
# Mỗi truyện được LLM chấm trước khi dịch (hook, tiền đề, twist, cảm xúc, nhịp, hợp khẩu vị Việt).
# Truyện yếu / dở dang / không an toàn quảng cáo bị loại ở chế độ auto => không tốn tiền dịch, đọc, render.
quality:
  enabled: true
  min_score: 6.5                   # thang 10; truyện "bình thường" ~5–6. Tăng lên 7 khi nguồn dồi dào
  require_complete: true           # loại truyện chỉ có 1 tập/đoạn
  require_ad_safe: true            # loại truyện 18+, bạo lực ghê rợn, chính trị
  min_chars: 3000

# ------------------------------------------------------------------ hook + TikTok
# Video YouTube mở đầu bằng 1 đoạn HOOK 2–5 phút: khoảnh khắc gay cấn nhất của truyện, câu đầu gây sốc,
# dừng đúng cao trào (không lộ kết) -> câu chuyển -> lời dẫn -> truyện từ đầu.
# Đoạn hook được dựng thêm thành clip TikTok dọc (tiktok.mp4) kèm phụ đề + lời mời sang YouTube nghe tiếp.
hook:
  enabled: true
  min_minutes: 2
  max_minutes: 5
  words_per_minute: 170    # tốc độ đọc ước tính của giọng TTS để quy ra số chữ

# YouTube Shorts (≤ 3 phút) cắt từ hook, dừng ở câu treo gần nhất + lời mời bấm sang video đầy đủ.
# upload: true => khi bạn bấm Đăng video dài, bot tự đăng luôn Shorts có link sang video đó.
shorts:
  enabled: true
  max_seconds: 175
  upload: true
  title_prefix: ""
  banner: "Bản đầy đủ: bấm video liên quan ▼"

tiktok:
  enabled: true
  badge: "{channel_name} · Số {episode}"
  banner: "Nghe trọn bộ trên YouTube: {channel_name}"
  caption_font: assets/fonts/Baloo2.ttf
  caption_font_variation: ExtraBold
  tiktok_highlight: "#FFD54F"
  fps: 24
  max_video_kbps: 1000     # giữ clip 5 phút ~40 MB (bot Telegram gửi tối đa 50 MB)
  lead_in: 0.2             # giọng vào gần như ngay lập tức — 1–2 giây đầu quyết định người xem lướt qua hay không
  tail: 1.5

# ------------------------------------------------------------------ duyệt qua điện thoại
# Mỗi video xong, bot Telegram gửi thumbnail + clip xem thử + bản dịch + nút Đăng/Hẹn giờ/Bỏ.
review:
  enabled: false
  bot_token: null        # hoặc biến môi trường TELEGRAM_BOT_TOKEN (tạo bot qua @BotFather)
  chat_id: null          # nhắn /id cho bot để lấy, hoặc biến môi trường TELEGRAM_CHAT_ID
  state_file: output/reviews.json
  preview_head: 120      # giây đầu video trong clip xem thử
  preview_middle: 45     # + bấy nhiêu giây ở giữa video
  daily_run: "02:00"     # bot tự chạy `auto` mỗi ngày giờ này; null để tắt
  report_weekday: 6      # gửi báo cáo kênh hằng tuần: 0=thứ Hai … 6=Chủ nhật; null để tắt
  report_time: "20:00"

# Khi bấm Đăng/Hẹn giờ trên điện thoại, PC tự upload lên YouTube.
youtube:
  enabled: false
  client_secrets: secrets/client_secret.json   # OAuth "Desktop app" tạo ở Google Cloud Console
  token_file: secrets/youtube_token.json
  category_id: 24                              # 24 = Giải trí
  declare_synthetic: true                      # khai báo nội dung dùng giọng AI
  timezone: Asia/Ho_Chi_Minh
  schedule_slots: ["19:30", "21:30"]           # nút "Hẹn giờ" chọn khung trống gần nhất
  playlists: {}            # chủ đề -> ID playlist, vd {hai_huoc_gia_dinh: PLxxxx}: tự thêm video, mô tả có link

# Mỗi chủ đề ghi đè được bất kỳ khóa nào ở trên (genre, tts, render...) => giọng, nhịp đọc,
# tone footage riêng cho từng chủ đề.
topics:
  # NGÁCH CHÍNH — chọn theo khảo sát thị trường (docs/market-analysis.md, chạy lại: python -m autovideo market):
  # ngôn tình hiện đại / hôn nhân hào môn dịch từ truyện ngắn Trung: ~92% video mới đạt ≥1.000 view/ngày,
  # 27 kênh khác nhau cùng ăn view (cầu rộng, kênh mới vào được), độ dài thắng ~50–60 phút,
  # nguồn truyện Trung dồi dào => hợp nhất với công cụ này.
  - name: ngon_tinh_hao_mon
    label: "Ngôn tình hiện đại – hôn nhân hào môn, tổng tài (NGÁCH CHÍNH)"
    keywords: ["豪门 甜宠 短篇小说 有声 完结", "先婚后爱 有声小说 一口气听完", "追妻火葬场 有声书 完结",
               "霸总 离婚 有声小说 全文", "知乎 豪门 婚姻 小说 有声"]
    sites: [bilisearch, ytsearch]
    min_minutes: 25              # bản Việt ~45–60 phút là độ dài video top đang có
    max_minutes: 90
    genre: ngon_tinh
    tts:
      voice: vi-VN-HoaiMyNeural      # edge; nếu dùng google: giọng nữ ấm (xem `voices --engine google`)
      rate: "-3%"
      pitch: "+0Hz"
      google: {voice: vi-VN-Chirp3-HD-Aoede, speaking_rate: 0.97}
    channel:
      visual_style: "romantic chinese manhua illustration, elegant young woman and cold handsome CEO in a luxury penthouse at night, dramatic emotional moment, soft pink and gold palette, cinematic lighting"
      title_style: >-
        Ngôi thứ nhất của nữ chính + phản ứng bất ngờ của nam chính, kiểu "Tôi Đòi Ly Hôn, Tạ Tổng Lại Khóc Lóc Bám Dính",
        "Vợ Ngoan Bỗng Nhiên Né Tránh, Thái Tử Gia Hoảng Rồi", "Sau Ba Lần Từ Chối, Tôi Buông Tay". Gọi nam chính bằng
        Họ + "Tổng" hoặc "thái tử gia"/"thiếu gia". Tránh mở đầu bằng từ sáo đã bão hòa ("vả mặt", "trọng sinh", "trà xanh")
        — các từ này xuất hiện nhiều ở video ít view hơn.
    thumbnail: {paper_color: "#FBEFF1", title_color: "#5A1A2B", highlight_colors: ["#D81B60", "#B8860B"],
                badge_color: "#5A1A2B", badge_text_color: "#FFE9EF"}
    render: {mode: still, still: {scenes: 4}}

  # NGÁCH PHỤ (bật khi ngách chính đã có view đều): ngôn tình cổ đại / cung đấu — cùng tệp khán giả nữ,
  # trung vị ~2.900 view/ngày, 21 kênh trúng.
  - name: ngon_tinh_co_dai
    label: "Ngôn tình cổ đại – cung đấu, thứ nữ, thái tử phi (ngách phụ)"
    enabled: false
    keywords: ["古言 宫斗 短篇 有声 完结", "庶女 嫡女 有声小说 一口气听完", "太子妃 古言 有声书 完结"]
    sites: [bilisearch, ytsearch]
    min_minutes: 25
    max_minutes: 90
    genre: co_trang
    tts: {voice: vi-VN-HoaiMyNeural, rate: "-5%", pitch: "-2Hz"}
    channel:
      visual_style: "elegant chinese ancient palace illustration, noble lady in hanfu, intrigue and romance, crimson and gold palette, cinematic"
      title_style: >-
        Nêu thân phận nữ chính + nước cờ bất ngờ, kiểu "Thứ Nữ Không Tranh Nhưng Giành Được Tất Cả",
        "Nha Hoàn Cướp Hôn Sự, Nào Ngờ Giúp Ta Thành Thái Tử Phi". Xưng "ta" khi là ngôi thứ nhất cổ đại.
    thumbnail: {paper_color: "#F7EEDF", title_color: "#6B1515", highlight_colors: ["#B71C1C", "#8D6E00"]}
    render: {mode: still, still: {scenes: 4}}

  # Các ngách dưới đây tạm tắt (điểm thấp hơn hoặc kém hợp công cụ — xem docs/market-analysis.md)
  - name: hai_huoc_gia_dinh
    enabled: false
    label: 'Hài gia đình, "mỏ hỗn"'
    keywords: ["沙雕 搞笑 小说 有声 完结", "搞笑家庭 短篇小说 一口气听完", "知乎 沙雕文 有声书"]
    sites: [bilisearch, ytsearch]
    min_minutes: 15
    max_minutes: 120
    genre: hai_huoc
    tts: {voice: vi-VN-HoaiMyNeural, rate: "+0%", pitch: "+0Hz"}
    channel: {visual_style: "cute chibi cartoon illustration, thick clean outlines, pastel yellow background, funny exaggerated expression, sticker style"}
    thumbnail: {paper_color: "#FFF6DA", highlight_colors: ["#D32F2F", "#2E7D32"]}
    render: {mode: thumbnail}

  - name: pha_an_kinh_di
    enabled: false
    label: "Phá án / kinh dị có cú twist"
    keywords: ["悬疑 推理 短篇小说 有声 完结", "知乎 悬疑故事 一口气听完", "刑侦 案件 小说 有声书"]
    sites: [bilisearch, ytsearch]
    min_minutes: 15
    max_minutes: 150
    genre: pha_an
    tts: {voice: vi-VN-NamMinhNeural, rate: "-5%", pitch: "-4Hz"}
    channel: {visual_style: "dark dramatic anime illustration, intense close-up eyes, chaotic brush strokes, red and navy palette"}
    thumbnail: {badge: "Audio Phá Án · Số {episode}", paper_color: "#F2EFEA", title_color: "#2B2540",
                highlight_colors: ["#8E1B1B"], badge_color: "#2B2540", badge_text_color: "#F2EFEA", image_side: right}
    render: {mode: still, still: {scenes: 4}}

  - name: ngon_tinh_thieu_gia
    enabled: false
    label: "Ngôn tình hiện đại, thiếu gia – tổng tài"
    keywords: ["霸总 甜宠 短篇 有声 完结", "知乎 言情 豪门 一口气听完", "富二代 甜文 有声小说"]
    sites: [bilisearch, ytsearch]
    min_minutes: 15
    max_minutes: 150
    genre: hien_dai
    tts: {voice: vi-VN-HoaiMyNeural, rate: "-3%", pitch: "+0Hz"}
    channel: {visual_style: "aesthetic korean-style portrait photo, moody city night, soft cinematic light, film grain"}
    thumbnail: {paper_color: "#F8EBD3", title_color: "#8E1B1B", highlight_colors: ["#1F1F1F"], image_side: right}
    render: {mode: thumbnail}

  - name: thanh_xuan_tham_thich
    enabled: false
    label: "Thanh xuân, thầm thích, chữa lành"
    keywords: ["暗恋 青春 校园 短篇 有声", "暗恋成真 甜文 一口气听完", "知乎 暗恋 故事 完结"]
    sites: [bilisearch, ytsearch]
    min_minutes: 10
    max_minutes: 120
    genre: hien_dai
    tts: {voice: vi-VN-HoaiMyNeural, rate: "-6%", pitch: "+0Hz"}
    channel: {visual_style: "aesthetic candid photo of a young couple from behind, warm street light at night, soft focus, nostalgic"}
    thumbnail: {paper_color: "#F3F1EE", title_color: "#5B5555", highlight_colors: ["#C2185B"]}
    render: {mode: footage, footage: {tone: warm}}

  # Chủ đề cũ — bật lại nếu muốn
  - name: co_trang_tu_tien
    label: "Cổ trang / tiên hiệp / tu tiên"
    enabled: false
    keywords: ["古风 有声小说 完结", "仙侠 有声书 一口气听完", "修仙 小说 广播剧"]
    sites: [bilisearch, ytsearch]
    min_minutes: 20
    max_minutes: 150
    genre: co_trang
    tts: {voice: vi-VN-NamMinhNeural, rate: "-6%", pitch: "-6Hz"}
    render: {mode: still}

  - name: tam_su_dem_khuya
    label: "Tâm sự đêm khuya, chuyện đời thật"
    enabled: false
    keywords: ["深夜电台 情感故事", "睡前故事 情感 治愈", "深夜情感 真实故事"]
    sites: [bilisearch, ytsearch]
    min_minutes: 15
    max_minutes: 90
    genre: tam_su
    tts: {voice: vi-VN-HoaiMyNeural, rate: "-10%", pitch: "-3Hz"}
    render: {mode: footage, footage: {tone: warm}}

channel:
  name: "Đêm Nghe Truyện"
  # Tiêu đề YouTube dạng phổ biến của kênh truyện audio. Biến: {story_title} {channel_name} {episode}
  # Để null thì dùng tiêu đề SEO do LLM viết.
  title_template: "[Truyện Audio] {story_title} (Full) | {channel_name}"
  episode_start: 1         # số tập đầu tiên (đánh số tăng dần cho mọi video của kênh)
  subscribe_url: null      # vd https://www.youtube.com/@tenkenh?sub_confirmation=1 (hiện trong mô tả)
  description_footer: ""   # dòng cố định cuối mô tả (bản quyền, liên hệ…)
  # Phong cách hình ảnh cố định của kênh — được nối vào mọi image_prompt
  visual_style: "cinematic chinese ink painting, muted teal and amber palette, soft volumetric light, misty, 16:9"
  intro: true              # LLM viết lời dẫn ~30s mang dấu ấn kênh
  outro: true              # LLM viết lời bình cuối truyện

source:
  # yt-dlp search prefix: bilisearch | ytsearch  (Douyin/Ximalaya/Xiaoyuzhou: truyền URL trực tiếp)
  search_site: bilisearch
  max_per_keyword: 3
  cookies_file: null       # cookies.txt nếu nguồn cần đăng nhập

asr:
  engine: local            # local (máy bạn) | groq (cloud, nhanh, có free) | gemini (cloud)
  chunk_minutes: 10        # cloud: cắt audio thành đoạn ngắn trước khi gửi
  groq_model: whisper-large-v3
  gemini_model: gemini-2.5-flash
  # --- chỉ dùng khi engine: local ---
  model: large-v3          # máy yếu: small / medium
  device: cuda             # cuda | cpu
  compute_type: float16    # float16 (GPU) | int8 (CPU)
  language: zh
  vad_filter: true

llm:
  provider: anthropic      # anthropic | gemini
  model: claude-opus-5-5   # chất lượng dịch/viết hook tốt nhất. Rẻ hơn: claude-sonnet-5-5. Gemini: gemini-2.5-pro
  effort: medium           # chỉ dùng cho anthropic: low | medium | high
  price: null              # [input, output, cache_read, cache_write] USD/1M token nếu model không có trong bảng giá
  qa_retries: 2            # dịch lại đoạn lỗi (sót chữ Hán, bị lược, bị từ chối) tối đa bấy nhiêu lần
  source_chunk_chars: 1500 # số ký tự tiếng Trung mỗi lần gửi dịch
  context_chars: 600       # đoạn dịch trước đó gửi kèm để giữ xưng hô nhất quán
  glossary:                # thuật ngữ / tên riêng cố định (Trung: Việt)
    师尊: "sư tôn"
    灵气: "linh khí"

tts:
  # edge:       miễn phí, giọng HoaiMy/NamMinh (nhiều kênh dùng => kém nổi bật)
  # google:     Google Cloud TTS Chirp 3 HD — tự nhiên hơn hẳn, ~1–2 USD / video 1 tiếng (GOOGLE_TTS_API_KEY)
  # elevenlabs: biểu cảm nhất, có clone giọng — đắt (ELEVENLABS_API_KEY)
  # command:    gọi F5-TTS / XTTS-v2 chạy trên máy bạn
  # Xem giọng có sẵn: python -m autovideo voices --engine google
  engine: edge
  voice: vi-VN-HoaiMyNeural  # (edge) hoặc vi-VN-NamMinhNeural
  rate: "-8%"
  pitch: "-4Hz"
  chunk_words: 250         # 200–300 chữ / đoạn đọc
  gap_ms: 450              # khoảng nghỉ giữa các đoạn
  google:
    voice: vi-VN-Chirp3-HD-Charon
    speaking_rate: 0.95
  elevenlabs:
    voice_id: null
    model_id: eleven_v3
    stability: null
  # engine: command — gọi F5-TTS / XTTS-v2 local. Placeholder: {text_file} {text} {out}
  command: >-
    f5-tts_infer-cli --model F5TTS_v1_Base --ref_audio assets/voice_ref.wav
    --ref_text "" --gen_file {text_file} --output_dir {out_dir} --output_file {out_name}

thumbnail:
  image_engine: placeholder   # placeholder | comfyui (GPU máy bạn) | cloud (Google Imagen, không tốn GPU)
  cloud_image_model: imagen-4.0-generate-001   # hoặc gemini-2.5-flash-image
  size: [1280, 720]
  layout: split               # split: ảnh 1 bên + TÊN TRUYỆN chữ lớn trên nền giấy (kiểu kênh truyện audio Việt)
                              # overlay: chữ đè lên ảnh full khung
  font: assets/fonts/Anton-Regular.ttf   # chạy `python scripts/get_fonts.py` để tải; thiếu thì dùng DejaVu
  badge_font: assets/fonts/Oswald.ttf
  badge: "{channel_name} · Số {episode}" # nhãn trên tên truyện; "" để tắt. Biến: {channel_name} {episode}
  badge_color: "#F6E3A1"
  badge_text_color: "#4A2A12"
  mascot: assets/templates/mascot.png    # PNG trong suốt mascot/logo kênh (tùy chọn)
  template: null                         # PNG trong suốt phủ toàn khung (khung viền, sticker…) (tùy chọn)
  # --- layout: split ---
  paper_color: "#FBF4E6"
  title_color: "#3A1E12"
  highlight_colors: ["#C62828", "#2E7D32"]  # màu tô các cụm từ đắt giá (LLM chọn)
  image_side: left                       # left | right
  image_ratio: 0.46
  max_lines: 4
  # --- layout: overlay ---
  text_color: "#FFE9A8"
  stroke_color: "#000000"
  text_box: [0.05, 0.50, 0.62, 0.95]     # vùng đặt chữ (tỷ lệ x0,y0,x1,y1)
  comfyui:                 # dùng khi image_engine: comfyui
    enabled: false
    url: http://127.0.0.1:8188
    workflow: assets/comfyui_workflow_api.json  # export "API format"; đặt {{PROMPT}} trong node text
    timeout: 600

render:
  mode: still              # footage | still (ảnh minh họa theo cảnh) | thumbnail (chỉ dùng ảnh thumbnail làm nền)
  resolution: [1920, 1080]
  fps: 30
  encoder: auto            # auto | h264_nvenc | libx264
  x264_preset: veryfast    # khi không có GPU NVIDIA: máy yếu dùng superfast / ultrafast
  lead_in: 0.5             # giây nhạc trước khi giọng đọc bắt đầu (hook cần vào ngay)
  tail: 5.0                # giây nhạc sau khi đọc xong
  footage:
    dir: assets/footage
    tone: warm             # thư mục con: warm | dark | bright
    lut: null              # file .cube áp chung
    brightness: -0.04
    seed: null             # null = ngẫu nhiên mỗi video
  still:
    scenes: 6              # số ảnh minh họa (theo chương) — tránh Reused Content
    zoom: 0.08             # biên độ Ken Burns
    zoom_period: 40        # giây cho 1 chu kỳ zoom in/out
    loop: true             # chỉ render 1–2 chu kỳ mỗi ảnh rồi nối lặp (nhanh gấp hàng chục lần)
    upscale: 2.0           # độ mượt Ken Burns; máy yếu: 1.5
    overlay: null          # assets/overlays/dust.mp4 (bụi, mưa, khói…)
    overlay_opacity: 0.35
  audio:
    music_dir: assets/music
    ducking: sidechain     # sidechain | fixed
    music_db: -23          # fixed: mức nhạc nền cố định suốt video
    music_db_idle: -14     # sidechain: mức nhạc khi không có giọng; tự hạ ~10dB khi có giọng
    fade_in: 3
    fade_out: 6
    loudnorm: true
